services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - LUMA_AGENTS_API_KEY=${LUMA_AGENTS_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Persist generated assets and state across restarts
      - ./out:/app/out
      # Mount the spec so edits from the UI are saved locally
      - ./brands:/app/brands
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Dev-only override: use `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
  # to get hot-reload on the frontend (no rebuild needed).
