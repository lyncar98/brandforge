[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brandforge"
version = "0.2.0"
description = "Brand-as-Code: manage a brand's image + content assets declaratively on Luma uni-1 and Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lyndon" }]
keywords = ["luma", "uni-1", "claude", "anthropic", "image-generation", "brand", "infrastructure-as-code"]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brandforge = "brandforge.cli:main"

[tool.setuptools]
packages = ["brandforge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
