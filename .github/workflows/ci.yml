name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: End-to-end smoke test (mock backends, no key, no spend)
        run: |
          python -m brandforge plan --mock
          python -m brandforge apply --mock --out out --fail-on-error
      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brandforge-report-${{ matrix.python-version }}
          path: out/report.md
