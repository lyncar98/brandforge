services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: build        # stop before nginx stage
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
